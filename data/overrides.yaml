# Manual overrides. Resolves review-queue items the alias map can't.
# Re-applied every run, so an entry here is permanent until you remove it.

# Force two occurrences to merge (by occurrence id from the review issue).
# The first id wins field conflicts.
merge:
  - [235, 108]   # Postmodern Jukebox, Pensacola Saenger: Ticketmaster + 92ZEW (92ZEW's venue was resolved after TM's copy existed)
  - [236, 110]   # Daniel Tosh, Pensacola Saenger: same story
#  - [1234, 5678]

# Force an occurrence onto a series (by occurrence id -> series slug).
attach_to_series: {}
#  1234: greater-gulf-state-fair

# Never merge these two (false positive from the fuzzy matcher).
never_merge:
  - [271, 269]   # Pensacola Invitational: 2-day package vs Saturday-only are different products

# Confirm cancellation (occurrence id) — removes it from the site.
cancelled:
  - 167   # Corey O'Brien, Crescent Theater: TicketWeb listing 404s (checked 2026-10-02)
  - 348   # Orange Beach Fall Pop-Up Farmers Market: moved from Oct 4 to Oct 11 (weather)
  - 326   # Infinity Bicycles Ribbon Cutting: chamber page now shows a different event

# Clear a cancellation flag (occurrence id) — it's still happening.
not_cancelled:
  - 333   # Coffee with the Chamber: Calagaz Printing still live on the chamber calendar (2026-10-02)
  - 325   # StoryBrand Marketing #2: still live on the chamber calendar (2026-10-02)

# Publish a held item as-is (occurrence id). Use when the venue is genuinely
# unknown but the event is real — better to add an alias in venues.yaml.
force_publish:
  - 385   # Fall Brawl Festival: MOB Moms' own vendor market at 2700 Newman Rd; no named venue
