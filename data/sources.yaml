  regions: [coastal]
  brand_tokens: ["City of Gulf Shores"]
  license_notes: "Public CivicPlus RSS feed. Municipal calendar (public meetings + community events)."
  redistributable: true
  expected_min_events: 2
  config:
    feed_url: https://www.gulfshoresal.gov/RSSFeed.aspx?ModID=58&CID=All-calendar.xml

