- id: ticketmaster
  name: Ticketmaster
  url: https://www.ticketmaster.com
  collector_type: ticketmaster
  tier: B
  curated: false
  regions: [mobile, coastal]
  brand_tokens: []
  license_notes: >
    Discovery API v2. Terms require attribution ("Powered by Ticketmaster" style credit)
    and a link back to the Ticketmaster event page on every listing. No image reuse
    (images are artist/label owned) — image_ok is forced false. Do not cache beyond
    reasonable refresh; do not resell. Affiliate program exists — evaluate.
  redistributable: false
  expected_min_events: 10
  config:
    # Two sweeps: Mobile metro and the Gulf Shores / Orange Beach corridor
    sweeps:
      - {label: mobile,  latlong: "30.6954,-88.0399", radius_miles: 40, regions: [mobile]}
      - {label: coastal, latlong: "30.2794,-87.6720", radius_miles: 40, regions: [coastal]}

- id: gulfshores-city
  name: City of Gulf Shores
  url: https://www.gulfshoresal.gov/Calendar.aspx
