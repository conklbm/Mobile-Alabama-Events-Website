# Event sources. One entry per source. Synced into the `sources` table every run
# (YAML wins for config fields; the DB keeps runtime fields like last_successful_pull).
#
# collector_type: tribe_api | ticketmaster | civicplus_rss | ics | jsonld | manual
# tier:  A = venue/organizer's own site   B = ticketing platform   C = aggregator/curator
# regions: list — ["mobile"], ["coastal"], or both
# curated: true when a human picks each event (drives curation_score)
# brand_tokens: strings that identify the source's OWN events (self-promo detection)
# license_notes / redistributable: REQUIRED. Record terms now, not after promising a feed.
# expected_min_events: floor for the silent-breakage alarm (0 = don't alarm on low count)

- id: 92zew
  name: 92ZEW
  url: https://92zew.net
  collector_type: tribe_api
  tier: C
  curated: true
  regions: [mobile]
  brand_tokens: ["92ZEW", "92 ZEW", "ZEW"]
  license_notes: "Public WP REST endpoint (The Events Calendar). Community radio calendar. Link back to listing."
  redistributable: false
  expected_min_events: 40

