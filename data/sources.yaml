- id: 92zew-rundown
  name: 92ZEW Weekend Rundown
  url: https://92zew.net
  collector_type: zew_rundown
  tier: C
  curated: true
  regions: [mobile]
  brand_tokens: ["92ZEW", "92 ZEW", "ZEW"]
  license_notes: "Public WP REST posts. Editor's weekend picks; we take date, time and place, write nothing from the prose beyond the item's own description, and link back."
  redistributable: false
  expected_min_events: 0   # Thursday's run can land before that week's post
  config:
    posts: 3
    # an item is kept only if its place names one of these (or names a venue after "@")
    local_places: [mobile, daphne, fairhope, spanish fort, foley, orange beach, gulf shores, robertsdale, loxley,
                   stockton, theodore, mt. vernon, mount vernon, irvington, chickasaw, saraland, satsuma, semmes,
                   pensacola, dauphin island, bayou la batre, grand bay, citronelle, magnolia springs, elberta,
                   silverhill, summerdale, bay minette, wilmer, eight mile, prichard, point clear, montrose, malbis,
                   perdido, lillian, owa, the wharf, causeway, usa campus, hancock whitney, hancock-whitney, bellingrath]
    # ...and dropped if it names one of these (Mississippi Coast shows, away games on TV)
    away_places: [biloxi, gautier, gulfport, ocean springs, pascagoula, mississippi, ", ms", tuscaloosa, starkville,
                  knoxville, tallahassee, baton rouge, new orleans, birmingham, montgomery, auburn]

