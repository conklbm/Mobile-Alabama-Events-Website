# Pipeline settings. Tune here, not in code.

timezone: America/Chicago

collect:
  # First run pulls 90 days so the site doesn't look abandoned (cold start).
  # After that, a rolling window. Both are "days ahead of today".
  window_days: 90
  http_timeout: 60
  user_agent: "MobileBayEventsBot/0.1 (+https://www.mobilebayevents.com/about/)"

dedup:
  # rapidfuzz token_set_ratio thresholds (0-100)
  match_threshold: 82       # >= this: same event
  ambiguous_floor: 70       # between floor and threshold: review queue
  venue_alias_threshold: 90 # fuzzy venue-name match against aliases

series:
  # Annual series: re-attach if within this many days of the previous year's date
  annual_window_days: 45

review:
  # Queue EVERYTHING for the first N runs. You cannot calibrate a threshold you
  # have never watched fail. Raise/lower after watching where parsers break.
  strict_until_run: 3

freshness:
  consecutive_misses_to_flag: 2
  stale_source_weeks: 3

publish:
  site_url: https://www.mobilebayevents.com
  site_name: Mobile Bay Events
  region: mobile
  featured_count: 10
  # One-off events 301 to the venue page this many days AFTER the event ends.
  one_off_redirect_after_days: 7

# Where events sit, for the area filter and the two rings (decided 2026-10-07: "the site is for the
# entire Mobile Bay"). Core ring: everything shows. Outer ring: only what's worth the drive.
# A city in no area falls back to the venue/source `regions` tags.
areas:
  mobile:
    label: Mobile
    ring: core
    cities: [Mobile, Prichard, Chickasaw, Saraland, Satsuma, Creola, Citronelle, Semmes, Wilmer, Eight Mile,
             Theodore, Irvington, Grand Bay, Bayou La Batre, Coden, Dauphin Island, Mount Vernon, Mt. Vernon, Axis,
             Tillmans Corner, West Mobile, Downtown Mobile]
  eastern-shore:
    label: Eastern Shore
    ring: core
    cities: [Daphne, Spanish Fort, Fairhope, Point Clear, Montrose, Malbis, Loxley, Robertsdale, Silverhill,
             Summerdale, Bay Minette, Stockton, Stapleton, Rosinton, Fish River]
  baldwin-coast:
    label: Baldwin Coast
    ring: outer
    cities: [Foley, Gulf Shores, Orange Beach, Fort Morgan, Elberta, Lillian, Magnolia Springs, Bon Secour,
             Josephine, Seminole, Perdido Beach]
  pensacola:
    label: Pensacola
    ring: outer
    cities: [Pensacola, Pensacola Beach, Perdido Key, Gulf Breeze, Milton, Pace, Cantonment, Navarre]

outer_ring:
  # sources whose outer-ring events always count: ticketed shows and editors' picks
  draw_sources: [ticketmaster, 92zew, 92zew-rundown, flora-bama-events, gulfshores-festivals]
  # ...plus any title that reads like an event people drive for
  # (single quotes: YAML double quotes would turn \b into a backspace)
  draw_words: 'festival|\bfest\b|\bfair\b|parade|fireworks|rodeo|air show|regatta|mardi gras|tree lighting|marathon|triathlon|concert'
  # ...minus venue housekeeping that rides along with a draw source
  never: "public (ice )?skating|after game skate|parking pass|season tickets?"
  # per-area tightening (Brooks 2026-10-07: "Pensacola, the biggest events only")
  areas:
    pensacola:
      venues: [pensacola-bay-center, pensacola-saenger]   # ticketed shows count only at the arena and the Saenger
      venues_apply_to: [ticketmaster, 92zew, 92zew-rundown]   # festival lists (Flora-Bama, gulfshores.com) count anywhere
      never: 'tribute|\blegacy\b|rumours of|fab four|ice flyers|green room|package|saturday only|sunday only|ballet pensacola|pensacola symphony|pensacola opera'
