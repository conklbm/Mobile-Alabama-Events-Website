# Happy hours guide -> /happy-hours/ (and a block on matching venue pages).
# Hand-kept, not collected. Rechecked monthly by the "monthly happy hour check" cloud routine.
#
#   windows: days mon..sun, start/end in 24h Mobile time (end may be "close")
#   deals:   short and factual, as the business states them; leave empty rather than guess
#   note:    our own one line
#   url:     the page that confirms it (first-party preferred); checked: date last confirmed
#   status: unverified  -> kept for the monthly check, NOT shown on the site
#   source_kind: in-person -> Brooks saw it at the bar (no website); the monthly check keeps it unless the place closes
#   venue:   optional venues.yaml slug; links the name to that venue page when it exists

