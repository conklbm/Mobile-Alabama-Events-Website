#   aliases:     every spelling seen in the wild (case-insensitive, punctuation-insensitive)
#   domains:     venue's own web domains — a listing linking here is a Tier A origin (one-hop rule)
#   address / city / state / zip / lat / lng
#   regions:     list — mobile, coastal, or both (Dauphin Island is both)
#   notes:       original content shown on the venue page (parking, kids, etc.)
#
# Unknown venue names land in the review queue. Add the alias here, next run resolves it.

