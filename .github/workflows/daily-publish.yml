name: Daily republish

# Re-render site/ from the existing store every morning so past days drop off the static pages.
# No collecting here; the Thursday job does that.

on:
  schedule:
    - cron: "0 10 * * *"   # 5:00 AM Central
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Publish
        env:
          SITE_URL: https://www.mobilebayevents.com
        run: uv run python -m pipeline publish
      - name: Commit site
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add site vercel.json
          git diff --cached --quiet || git commit -m "daily republish $(date -u +%F)"
          git push
